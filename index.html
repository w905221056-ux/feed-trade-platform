<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>饲料原料贸易平台｜首页</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f5f8;
  color:#172033;
  font-family:-apple-system,BlinkMacSystemFont,
  "PingFang SC","Microsoft YaHei",Arial,sans-serif;
}

header{
  background:#142033;
  color:#fff;
  padding:22px 20px;
}

header b{
  font-size:20px;
}

header small{
  display:block;
  margin-top:6px;
  color:#a9b7ca;
}

main{
  max-width:1000px;
  margin:auto;
  padding:24px 16px;
}

.hero{
  background:#fff;
  border:1px solid #e0e6ee;
  border-radius:14px;
  padding:24px;
  margin-bottom:16px;
}

.hero h1{
  margin:0;
  font-size:28px;
}

.hero p{
  color:#68768a;
  line-height:1.7;
}

.modules{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.module{
  background:#fff;
  border:1px solid #e0e6ee;
  border-radius:14px;
  padding:20px;
}

.module h2{
  margin:0 0 8px;
  font-size:20px;
}

.module p{
  color:#68768a;
  line-height:1.6;
  min-height:52px;
}

.module button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:8px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

.module button:hover{
  background:#1d4ed8;
}

.note{
  margin-top:16px;
  background:#f7faff;
  border:1px solid #d9e5f8;
  border-radius:10px;
  padding:12px;
  color:#53647a;
  font-size:13px;
  line-height:1.7;
}

@media(max-width:600px){

  main{
    padding:14px 10px;
  }

  .hero h1{
    font-size:24px;
  }

  .modules{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<header>
  <b>饲料原料贸易平台</b>
  <small>平台首页 · 模块导航</small>
</header>

<main>

<section class="hero">

<h1>
饲料原料贸易平台
</h1>

<p>
平台当前提供两个独立测试模块。
首页只负责导航，不承载模块01或模块02的业务数据。
</p>

</section>


<section class="modules">

<div class="module">

<h2>
模块01｜客户中心
</h2>

<p>
客户资料、客户ID、客户详情、客户数据持久化及模块01自动测试。
</p>

<button
onclick="location.href='module01.html'"
>
进入模块01｜客户中心
</button>

</div>


<div class="module">

<h2>
模块02｜供应商 / 货源中心
</h2>

<p>
供应商、货源、sourceId、货源详情及模块02自动测试。
</p>

<button
onclick="location.href='module02.html'"
>
进入模块02｜供应商 / 货源中心
</button>

</div>

</section>


<div class="note">

<b>当前结构：</b>

首页 index.html

→ 模块01 module01.html

/

→ 模块02 module02.html

<br>

两个模块独立运行，模块01页面不再嵌套模块02入口。

</div>

</main>

</body>
</html>
